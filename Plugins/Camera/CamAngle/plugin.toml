name = "CamAngle"
category = "Camera"
version = "3.0.0"
description = "Starts every map without view parameters at the chosen camera angle, and sets how far Shift+right-drag can tilt the camera (WARP LowCamAngle / MediumCamAngle / HighCamAngle)."
libs = ["user32.lib"]

[settings.Pitch]
type = "float"
label = "Starting camera angle"
description = "Starting pitch in degrees: -65 is the lowest, -35 the highest, -45 the game's own."
min = -65
max = -35
step = 1
default = -45

[settings.Range]
type = "float"
label = "Tilt range"
description = "How far Shift+right-drag may tilt the camera from -45 on outdoor maps, in degrees: 20 is the game's own, 29.5 WARP LowCamAngle, 42 MediumCamAngle, 65 HighCamAngle (may show glitches on some maps)."
min = 10
max = 65
step = 0.5
default = 20
