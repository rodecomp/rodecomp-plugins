name = "Zoom"
category = "Camera"
version = "3.0.0"
description = "Sets how far the outdoor camera can zoom out while the game's /zoom option is on, at map start and for wheel / Ctrl+right-drag zoom."

[settings.Distance]
type = "float"
label = "Maximum zoom-out distance"
description = "Camera distance cap with /zoom on; the game uses 730 (400 with /zoom off, left unchanged). Common values: 128 (closer than the game), 600, 720, 840 and 1126.8 (farthest). Past about 1127 the screen edges may draw black."
min = 100
max = 2400
step = 1
default = 730
