name = "Appearance"
category = "Character"
version = "1.0.2"
description = "Body and hair resource names: shared body / head palettes, hair styles past the client's tables, and alternate outfits with their own costume number."

[settings.BodyPalettes]
type = "enum"
label = "Shared body palettes"
description = "Lets every job share one set of body palette files instead of one set per job."
values = ["Default", "MaleFemale", "Unisex"]
default = "Default"

[settings.BodyPalettes.choices]
Default = { label = "One set per job", description = "Each job uses its own palettes, as the game does." }
MaleFemale = { label = "Shared, per sex", description = "Every job uses 몸\\body_<sex>_<n>.pal (costumes: 몸\\costume_<c>\\body_<sex>_<n>_<c>.pal; Doram: <race>\\body_<sex>_<n>.pal)." }
Unisex = { label = "Shared by everyone", description = "The same files without _<sex>: one palette set for both sexes." }

[settings.HeadPalettes]
type = "enum"
label = "Shared head palettes"
description = "Lets every hair style share one set of palette files instead of one set per style."
values = ["Default", "MaleFemale", "Unisex"]
default = "Default"

[settings.HeadPalettes.choices]
Default = { label = "One set per style", description = "Each hair style uses its own palettes, as the game does." }
MaleFemale = { label = "Shared, per sex", description = "Every hair style uses 머리\\head_<sex>_<n>.pal." }
Unisex = { label = "Shared by everyone", description = "Every hair style uses 머리\\head_<n>.pal, for both sexes." }

[settings.DoramHeadPalettes]
type = "bool"
label = "Shared head palettes for Doram"
description = "Doram hair palettes follow HeadPalettes inside their race folder: <race>\\머리\\head_<sex>_<n>.pal or head_<n>.pal."
when = { HeadPalettes = ["MaleFemale", "Unisex"] }
default = false

[settings.Allow65kHairs]
type = "bool"
label = "Allow 65k hair styles"
description = "Hair styles past the built-in tables (0-45 human, 1-10 Doram) load <style>_<sex>.spr / .act and 머리<style>_<sex>_<n>.pal by number instead of falling back to style 13 / 10."
default = false

[settings.MaxHairStyle]
type = "int"
label = "Highest hair style"
description = "With Allow65kHairs, styles above this keep the game's fallback instead of naming a file you do not ship."
default = 65535
min = 46
max = 65535

[settings.ExtraOutfits]
type = "list"
of = "string"
label = "Extra alternate outfits"
description = "One per entry, 'outfit id = job id, costume' (e.g. '4440 = 4060, 2'): that outfit id loads the job's sprites and palettes from costume_<costume>\\<job>_<sex>_<costume>, like the client's own outfits do from costume_1. The server must know the outfit id."
default = []
