name = "WindowFrame"
category = "Window"
version = "2.1.0"
description = "Main window tweaks: custom title, small tool-window title bar, resizable frame with minimize/maximize buttons, borderless full screen."
libs = ["user32.lib"]

[settings.Title]
type = "string"
label = "Window title"
description = "Text of the main window's title bar; empty keeps the game's own title."
default = ""

[settings.MiniTitle]
type = "bool"
label = "Small title bar"
description = "Creates the main window as a tool window (WS_EX_TOOLWINDOW) with a small title bar."
default = false

[settings.SysMenu]
type = "bool"
label = "Resizable frame with system menu"
description = "Gives the windowed client a resizable frame with minimize, maximize and close buttons, keeping the client area size."
default = true

[settings.Borderless]
type = "bool"
label = "Borderless full screen"
description = "A window as large as the screen or larger is created as a borderless popup covering exactly the screen."
default = false
