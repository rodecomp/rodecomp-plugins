name = "LoginFlow"
category = "Login"
version = "1.2.0"
description = "Login screen flow: skip the service selection, make the login window's Opening button go back to it, set the missing-launcher message (WARP SkipServiceSelect / OpenToServiceSelect / CustomMissingLauncherMsg), and pick the only server without showing the server list."

[settings.SkipServiceSelect]
type = "bool"
label = "Skip service selection"
description = "Acts as if clientinfo.xml had <hideaccountlist> (read by the ClientInfo plugin). (WARP SkipServiceSelect)"
default = false

[settings.OpeningToServiceSelect]
type = "bool"
label = "Opening button returns to service selection"
description = "The login window's Opening button acts like its Cancel button: back to the service selection, or to the ClientInfo server list. (WARP OpenToServiceSelect)"
default = true

[settings.MissingLauncherMessage]
type = "string"
label = "Missing launcher message"
description = "Message shown when the client is started without the patcher; empty keeps the game's. (WARP CustomMissingLauncherMsg)"
default = ""

[settings.AutoSelectSingleServer]
type = "bool"
label = "Auto-select a single server"
description = "When the server list has exactly one server, it is selected at once and the server selection window is not shown."
default = false
