name = "Auras"
category = "Graphics"
version = "1.0.0"
description = "Max level aura textures and the job / level ranges that show which aura (WARP CustomAuraSprites / CustomAuraLimits)."

[settings.AuraSprites]
type = "bool"
label = "Dedicated aura textures"
description = "The level 99 aura uses effect\\auraring.bmp for its floating sparkles and effect\\aurafloat.tga for its rings instead of pikapika2.bmp / ring_blue.tga, which warp portals keep (WARP CustomAuraSprites)."
default = false

[settings.AuraLimits]
type = "list"
of = "string"
label = "Aura limits"
description = "Entries 'firstJob[-lastJob] : minLevel[-maxLevel] = aura' with aura 99, 150, 160, 185 or 4th, e.g. '4053-4113 : 150-159 = 150'. An actor whose job and base level match the first entry gets that aura, else none. Empty: the game's rules (WARP CustomAuraLimits)."
default = []
