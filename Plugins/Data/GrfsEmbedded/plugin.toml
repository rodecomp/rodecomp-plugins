name = "GrfsEmbedded"
category = "Data"
version = "2.0.0"
description = "Which GRF archives the game loads in place of its single data.grf: DATA.INI's [Data] entries, or the Archives list."

[settings.Source]
type = "enum"
label = "Archives from"
description = "DataIni: keys 9 to 0 of [Data] in DATA.INI, 0 taking priority; writes 2=data.grf if none is set. List: the Archives setting. DataGrf: data.grf only, as the game does."
values = ["DataIni", "List", "DataGrf"]
default = "DataIni"

[settings.Archives]
type = "list"
of = "path"
label = "GRF archives"
description = "With Source = List: archives to load instead of data.grf, later ones take priority."
filter = ["*.grf"]
default = []
