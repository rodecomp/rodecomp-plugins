name = "GrfsEmbedded"
category = "Data"
version = "2.0.2"
description = "Which GRF archives the game loads in place of its single data.grf: DATA.INI's [Data] entries, or the Archives list."

[settings.Source]
type = "enum"
label = "Archives from"
description = "Which GRF archives the game reads its files from."
values = ["DataIni", "List", "DataGrf"]
default = "DataIni"

[settings.Source.choices]
DataIni = { label = "DATA.INI", description = "The archives listed under [Data] in DATA.INI; 0= wins over 1= and so on. Adds 2=data.grf when the list is empty." }
List = { label = "My list", description = "The archives in GRF archives below." }
DataGrf = { label = "data.grf only", description = "Only data.grf, like the original game." }

[settings.Archives]
type = "list"
of = "path"
label = "GRF archives"
description = "Archives to load instead of data.grf, later ones take priority."
when = { Source = "List" }
filter = ["*.grf"]
default = []
