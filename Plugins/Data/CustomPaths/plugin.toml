name = "CustomPaths"
category = "Data"
version = "1.0.0"
description = "Loads your own files in place of the client's Lua tables, clientinfo.xml, licence and default BGM; every empty setting keeps the client's file (WARP CustomPath patches, CustomLicenseTxt, CustomClientInfo)."

[settings.DefaultBgm]
type = "string"
label = "Default BGM"
description = "Replaces bgm\\01.mp3 (login music, maps without BGM). Empty keeps the client's file (WARP CustomDefaultBGM)."
default = ""

[settings.ItemInfo]
type = "string"
label = "ItemInfo Lua"
description = "Replaces SystemEN\\iteminfo.lua. Empty keeps the client's file (WARP CustomItemInfoLub)."
default = ""

[settings.AchievementList]
type = "string"
label = "AchievementList Lua"
description = "Replaces system\\Achievement_list.lub. Empty keeps the client's file (WARP CustomAchieveLub)."
