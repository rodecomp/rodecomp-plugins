name = "UiTweaks"
category = "Interface"
version = "1.0.0"
description = "Adjusts small UI rules: RoDEx tax per item, guild exp donation limit, adventurer agency level range, English hotkey arrows and identified MVP drop names (WARP CustomRodexTax / CustomGuildExpLimit / CustomAdvAgencyLimits / FixArrowsCharset / BossDropIdentified)."

[settings.RodexTax]
type = "int"
label = "RoDEx tax per item"
description = "Zeny charged per item attached to a RoDEx mail, shown and checked by the client; 2500 is the client's. The 2% zeny tax is unchanged (WARP CustomRodexTax)."
default = 2500
min = 0

[settings.GuildExpLimit]
type = "int"
label = "Guild exp donation limit"
description = "Highest exp percentage a guild position can donate; 50 is the client's (WARP CustomGuildExpLimit)."
default = 50
min = 0
max = 100

[settings.AgencyLevelsBelow]
type = "int"
label = "Agency levels below"
description = "The adventurer agency's minimum level box starts this many levels below yours; 5 is the client's (WARP CustomAdvAgencyLimits)."
default = 5
min = 0
max = 127

[settings.AgencyLevelsAbove]
type = "int"
label = "Agency levels above"
description = "The adventurer agency's maximum level box starts this many levels above yours; 5 is the client's (WARP CustomAdvAgencyLimits)."
default = 5
min = 0
max = 127

[settings.EnglishArrows]
type = "bool"
label = "English hotkey arrows"
description = "The hotkey guide shows <, ^, >, v and = for the arrow and menu keys instead of Korean symbols (WARP FixArrowsCharset)."
default = true

[settings.MvpDropIdentified]
type = "bool"
label = "Identified MVP drop names"
description = "The MVP drop announcement names the item as identified (WARP BossDropIdentified)."
default = false
