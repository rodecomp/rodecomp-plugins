name = "InputLimits"
category = "Interface"
version = "2.1.0"
description = "Relaxes input checks: account ID and password minimum lengths on login, the 4-character minimum for character names, the no-space rule for guild names and the ASCII-only rule for names."

[settings.Username]
type = "bool"
label = "No minimum account ID length"
description = "The login window accepts an account ID shorter than 4 characters."
default = true

[settings.Password]
type = "bool"
label = "No minimum password length"
description = "The login window accepts a password shorter than 6 characters."
default = true

[settings.CharacterName]
type = "bool"
label = "No minimum character name length"
description = "Character creation and rename accept names of 1 to 3 characters; empty names are still refused."
default = true

[settings.GuildNameSpaces]
type = "bool"
label = "Allow spaces in guild names"
description = "Creating a guild accepts a name containing spaces."
default = true

[settings.NonAsciiNames]
type = "bool"
label = "Allow non-ASCII names"
description = "On langtype 1 (America), character names, chat room and shop titles may contain bytes 0x80 and up (e.g. Korean or accented letters) instead of being refused."
default = true
