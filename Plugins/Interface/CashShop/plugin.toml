name = "CashShop"
category = "Interface"
version = "1.0.0"
description = "Cash Shop tweaks: moves the Cash Shop icon and shows 0 instead of the unused second point balance (WARP MoveShopIcon / ZeroCinShop)."

[settings.MoveIcon]
type = "bool"
label = "Move the Cash Shop icon"
description = "Places the Cash Shop icon at IconX, IconY instead of 187 pixels left of the right edge, 16 from the top (WARP MoveShopIcon)."
default = false

[settings.IconX]
type = "int"
label = "Icon X"
description = "Horizontal position; a negative value counts from the right edge of the screen (WARP MoveShopIcon)."
default = -187
min = -1366
max = 1366

[settings.IconY]
type = "int"
label = "Icon Y"
description = "Vertical position; a negative value counts from the bottom edge of the screen (WARP MoveShopIcon)."
default = 16
min = -768
max = 768

[settings.ZeroSecondaryPoints]
type = "bool"
label = "Show 0 C for the second balance"
description = "The Cash Shop draws 0 C instead of the server-sent second point balance, which servers without Gravity's point system leave as garbage (WARP ZeroCinShop)."
default = false
