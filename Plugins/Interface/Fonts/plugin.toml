name = "Fonts"
category = "Interface"
version = "2.0.4"
description = "Changes the face, height, weight and charset of the game's system fonts and the client's text codepage, and makes the official custom fonts (RixSquirrel, RixLoveangel, ...) work from TrueType files with the service type's charset."
libs = ["gdi32.lib"]

[settings.FontName]
type = "string"
label = "Font face"
description = "Face name every system font is created with, e.g. Arial. Empty keeps the game's face. Windows falls back to a compatible font when it lacks the charset."
default = ""

[settings.HeightMode]
type = "enum"
label = "Font height"
values = ["Unchanged", "Character", "Cell", "Offset", "Limits"]
default = "Unchanged"

[settings.HeightMode.choices]
Unchanged = { label = "As the game does", description = "Each font keeps the game's height." }
Character = { label = "Same letter height", description = "Every font's letters are Height pixels tall." }
Cell = { label = "Same line height", description = "Every font's line, accents included, is Height pixels tall." }
Offset = { label = "Bigger or smaller", description = "Height offset is added to every font's height." }
Limits = { label = "Within limits", description = "Line heights are kept between the minimum and maximum cell heights." }

[settings.Height]
type = "int"
label = "Height"
description = "Letter height or line height in pixels, as picked above."
when = { HeightMode = ["Character", "Cell"] }
default = 10
min = 1
max = 100

[settings.HeightOffset]
type = "int"
label = "Height offset"
description = "Added to every font height."
when = { HeightMode = "Offset" }
default = 0
min = -128
max = 127

[settings.HeightMin]
type = "int"
label = "Minimum cell height"
description = "The lowest line height, 0 for none."
when = { HeightMode = "Limits" }
default = 10
min = 0
max = 100

[settings.HeightMax]
type = "int"
label = "Maximum cell height"
description = "The highest line height, 0 for none."
when = { HeightMode = "Limits" }
default = 0
min = 0
max = 100

[settings.WeightMode]
type = "enum"
label = "Font weight"
values = ["Unchanged", "All", "Offset", "Separate"]
default = "Unchanged"

[settings.WeightMode.choices]
Unchanged = { label = "As the game does", description = "Each font keeps the game's weight." }
All = { label = "One weight for all", description = "Every font gets Weight below." }
Offset = { label = "Bolder or thinner", description = "Weight offset is added to every font's weight." }
Separate = { label = "Normal and bold apart", description = "Normal fonts get Normal font weight, bold fonts Bold font weight." }

[settings.Weight]
type = "int"
label = "Weight"
description = "100 thin, 400 normal, 700 bold, 900 heavy."
when = { WeightMode = "All" }
default = 400
min = 0
max = 1000

[settings.WeightOffset]
type = "int"
label = "Weight offset"
description = "Added to every font weight (kept within 0 to 1000)."
when = { WeightMode = "Offset" }
default = 0
min = -1000
max = 1000

[settings.NormalWeight]
type = "int"
label = "Normal font weight"
description = "The weight of normal fonts."
when = { WeightMode = "Separate" }
default = 400
min = 100
max = 540

[settings.BoldWeight]
type = "int"
label = "Bold font weight"
description = "The weight of bold fonts."
when = { WeightMode = "Separate" }
default = 700
min = 550
max = 900

[settings.Charset]
type = "enum"
label = "System font charset"
description = "The character set of the game's interface fonts, for the letters of your language. The custom fonts below are not affected."
values = ["Unchanged", "ANSI", "BALTIC", "CHINESEBIG5", "DEFAULT", "EASTEUROPE", "GB2312", "GREEK", "HANGUL", "MAC", "OEM", "RUSSIAN", "SHIFTJIS", "SYMBOL", "TURKISH", "VIETNAMESE", "JOHAB", "ARABIC", "HEBREW", "THAI"]
default = "Unchanged"

[settings.Charset.choices]
Unchanged = { label = "As the game does" }
ANSI = { label = "Western" }
BALTIC = { label = "Baltic" }
CHINESEBIG5 = { label = "Chinese Traditional" }
DEFAULT = { label = "Windows default" }
EASTEUROPE = { label = "Central European" }
GB2312 = { label = "Chinese Simplified" }
GREEK = { label = "Greek" }
HANGUL = { label = "Korean" }
MAC = { label = "Mac" }
OEM = { label = "OEM (console)" }
RUSSIAN = { label = "Cyrillic" }
SHIFTJIS = { label = "Japanese" }
SYMBOL = { label = "Symbol" }
TURKISH = { label = "Turkish" }
VIETNAMESE = { label = "Vietnamese" }
JOHAB = { label = "Korean (Johab)" }
ARABIC = { label = "Arabic" }
HEBREW = { label = "Hebrew" }
THAI = { label = "Thai" }

[settings.CodePage]
type = "int"
label = "Text codepage"
description = "Codepage the client converts multibyte text with, whatever the service type, e.g. 65001 for UTF-8, 1252 for Western. -1 keeps the game's."
default = -1
min = -1
max = 65001

[settings.TrueTypeFonts]
type = "bool"
label = "Load the custom fonts from .ttf files"
description = "Every System\\Font\\*.ttf is loaded as a private font at start and the .eot embedding is skipped; turns CustomFontsCharset on. The .ttf files are not included."
default = false

[settings.CustomFontsCharset]
type = "bool"
label = "Custom fonts use the service type's charset"
description = "The custom fonts (RixSquirrel, RixLoveangel, ..., font families 20+) use the service type's charset instead of ANSI, so non-Korean service types render them correctly. Independent of the system font charset above."
default = false
