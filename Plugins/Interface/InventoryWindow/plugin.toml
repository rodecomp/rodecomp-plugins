name = "InventoryWindow"
category = "Interface"
version = "1.0.0"
description = "Raises the inventory window's resize limit and the accepted inventory expansion (WARP BiggerInventoryWindow / CustomInventoryExpandingLimit)."

[settings.MaxWidth]
type = "int"
label = "Maximum width"
description = "Largest width the inventory window can be dragged to; the game's is 320. (WARP BiggerInventoryWindow)"
default = 320
min = 320
max = 2048

[settings.MaxHeight]
type = "int"
label = "Maximum height"
description = "Largest height the inventory window can be dragged to; the game's is 240. (WARP BiggerInventoryWindow)"
default = 240
min = 240
max = 2048

[settings.ExpandLimit]
type = "int"
label = "Inventory expansion limit"
description = "Largest extra-slot count accepted from the server (ZC_EXTEND_BODYITEM_SIZE in game); the game's is 100. (WARP CustomInventoryExpandingLimit)"
default = 100
min = 100
max = 32767
