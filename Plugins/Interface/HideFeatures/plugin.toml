name = "HideFeatures"
category = "Interface"
version = "2.1.0"
description = "Disables the Cash Shop and/or the Roulette: their windows are never created and their buttons and hotkey do nothing; hides the login screen's Gravity logo, age rating and ads."

[settings.CashShop]
type = "bool"
label = "Disable the Cash Shop"
description = "No Cash Shop window, its hotkey does nothing and the Cash Shop call button is hidden."
default = true

[settings.Roulette]
type = "bool"
label = "Disable the Roulette"
description = "Neither the Roulette window nor its open button is ever created."
default = true

[settings.GravityImages]
type = "bool"
label = "Hide the Gravity login images"
description = "The login screen shows no Gravity logo, age-rating or advertisement image."
default = true
