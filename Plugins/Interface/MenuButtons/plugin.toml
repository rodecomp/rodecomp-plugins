name = "MenuButtons"
category = "Interface"
version = "1.1.0"
description = "Shows the Battleground button, hides chosen buttons of the menu below the HP/SP bars and adds buttons of your own."

[settings.Battleground]
type = "bool"
label = "Battleground button"
description = "The menu shows the Battleground button, which opens the battleground (entry queue) window and asks the server for the queue ranking. The game does not create it."
default = false

[settings.Hide]
type = "list"
of = "string"
label = "Hidden buttons"
description = "Buttons not created, by icon name: status, equip, item, skill, party, guild, battle, quest, map, navigation, option, bank, rec, mail, achievement, tip, shop, keyboard, attendance, adventurerAgency, repute, adventureguide, probability."
default = []

[settings.Custom]
type = "list"
of = "string"
label = "Extra buttons"
description = "One per entry, iconName=behavesLike: adds a button drawn from menu_icon\\bt_<iconName>.bmp and bt_<iconName>_press.bmp (32x34, magenta transparent) that does what the stock button behavesLike (one of the Hidden buttons names) does."
default = []
