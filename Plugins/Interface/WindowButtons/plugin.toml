name = "WindowButtons"
category = "Interface"
version = "1.1.2"
description = "Party, equipment and status window tweaks: party size shown, no Adventurer Agency, swap, title tab or attribute button in the equipment window, and a disabled or hidden trait status button."

[dependencies]
TextDrawHooks = "^1.0.0"

[settings.PartyLimit]
type = "int"
label = "Party size shown"
description = "Maximum shown after the member count at the bottom of the party window (\"3/12\"); 12 is the client's."
default = 12
min = 1
max = 127

[settings.NoAdventurerAgency]
type = "bool"
label = "No Adventurer Agency button"
description = "The party window has no Adventurer Agency (party recruitment) button; the others close the gap."
default = false

[settings.NoEquipSwap]
type = "bool"
label = "No equipment swap button"
description = "The equipment window shows no swap button."
default = false

[settings.NoEquipTitleTab]
type = "bool"
label = "No title tab"
description = "The equipment window has no Title tab."
default = false

[settings.NoEquipAttribute]
type = "bool"
label = "No attribute button"
description = "The equipment window shows no Equipment Attribute button and never opens that panel."
default = false

[settings.TraitButton]
type = "enum"
label = "Trait status button"
description = "The trait status button of the status window."
values = ["Default", "Disabled", "Hidden"]
default = "Default"

[settings.TraitButton.choices]
Default = { label = "Works", description = "As the game does." }
Disabled = { label = "Does nothing", description = "Shown, but clicking it does nothing." }
Hidden = { label = "Hidden", description = "The status window has no such button." }
