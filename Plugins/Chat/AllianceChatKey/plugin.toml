name = "AllianceChatKey"
category = "Chat"
version = "1.0.1"
description = "Changes the prefix that sends a chat line to Alliance chat from '#' to another symbol."
libs = ["user32.lib"]

[settings.Symbol]
type = "enum"
label = "Alliance chat prefix"
description = "Start a chat line with this symbol to send it to Alliance chat; the game uses #."
values = ["#", "^", "~", "!", "%", "*"]
default = "#"

[settings.Symbol.choices]
"%" = { label = "%", description = "Also the party chat prefix, which wins: lines starting with % go to the party." }
