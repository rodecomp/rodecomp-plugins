name = "PetTalkMarker"
category = "Chat"
version = "1.0.0"
description = "Marks automated pet chatter so it cannot pass for a player talking, e.g. \"Poring (pet) : I am hungry!\" (WARP PetTalkMarker)."

[settings.Text]
type = "string"
label = "Marker text"
description = "Text of the marker, 1 to 12 characters. (WARP PetTalkMarker)"
default = "pet"

[settings.Brackets]
type = "enum"
label = "Brackets"
description = "Brackets around the marker. (WARP PetTalkMarker)"
values = ["Round", "Square", "Angled", "None"]
default = "Round"

[settings.Side]
type = "enum"
label = "Side"
description = "Marker before or after the pet name. (WARP PetTalkMarker)"
values = ["After", "Before"]
default = "After"
