name = "ChatColors"
category = "Chat"
version = "1.0.0"
description = "Recolours chat lines in the chat window: GM/announcement, guild, party (others and yourself) and public (others and yourself) messages (WARP CustomGMColor / CustomGuildColor / CustomPartyColor / CustomPartyColorSelf / CustomPublicColor / CustomPublicColorSelf). Each colour is RRGGBB hex; the defaults are the game's own colours."

[settings.GM]
type = "string"
label = "GM chat colour"
description = "RRGGBB colour of GM messages (the yellow line; also replaces the Thai cyan and German orange variants). (WARP CustomGMColor)"
default = "ffff00"

[settings.Guild]
type = "string"
label = "Guild chat colour"
description = "RRGGBB colour of guild chat. (WARP CustomGuildColor)"
default = "b4ffb4"

[settings.Party]
type = "string"
label = "Party chat colour (others)"
description = "RRGGBB colour of party chat from other members. (WARP CustomPartyColor)"
default = "ffc8c8"

[settings.PartySelf]
type = "string"
label = "Party chat colour (yourself)"
description = "RRGGBB colour of your own party chat. (WARP CustomPartyColorSelf)"
default = "ffc800"

[settings.Public]
type = "string"
label = "Public chat colour (others)"
description = "RRGGBB colour of public chat from other players. (WARP CustomPublicColor)"
default = "ffffff"

[settings.PublicSelf]
type = "string"
label = "Public chat colour (yourself)"
description = "RRGGBB colour of your own public chat. (WARP CustomPublicColorSelf)"
default = "00ff00"
