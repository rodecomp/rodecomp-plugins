name = "WARP_NoLoginLimits"
category = "WARP"
version = "2.0.0"
description = "Removes the minimum lengths of the account ID and/or the password on the login window (WARP NoLoginLimits / NoUsernameLimit / NoPasswordLimit)."

[settings.Username]
type = "bool"
label = "No minimum account ID length"
description = "The login window accepts an account ID shorter than 4 characters."
default = true

[settings.Password]
type = "bool"
label = "No minimum password length"
description = "The login window accepts a password shorter than 6 characters."
default = true
