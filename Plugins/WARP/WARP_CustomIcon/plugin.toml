name = "WARP_CustomIcon"
category = "WARP"
version = "1.1.0"
description = "Sets a custom .ico on the main window's title bar and taskbar entry, from the Icon setting (WARP CustomIcon)."
conflicts = ["WARP_RestoreIcon"]
libs = ["user32.lib"]

[settings.Icon]
type = "path"
label = "Icon file"
description = "The .ico file; a relative path is relative to the client folder."
kind = "file"
filter = ["*.ico"]
default = "plugins/WARP_CustomIcon.ico"
