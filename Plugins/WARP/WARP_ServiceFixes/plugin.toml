name = "WARP_ServiceFixes"
category = "WARP"
version = "1.0.0"
description = "Makes any service type behave like the Korean client: Korean ExternalSettings, no message-string decoding, service flags always stored (rodecomp patches 0001-0003)."

[settings.KoreanExternalSettings]
type = "bool"
label = "Load the Korean ExternalSettings"
description = "Always loads Lua Files\\service_korea\\ExternalSettings_kr*, whatever the service type."
default = true

[settings.NoMessageRot]
type = "bool"
label = "Do not decode message strings"
description = "Message, pet and monster talk strings are used as-is instead of being letter-mirrored on non-Korean service types."
default = true

[settings.ServiceFlags]
type = "bool"
label = "Always store the service flags"
description = "The server-sent service flags are stored for every service type, not only Korea and a few others."
default = true
