version = "2.0.0"
description = "Sets how far the outdoor camera can zoom out, from the game's default (0%) to the farthest (100%), at map start and for wheel / Ctrl+right-drag zoom (WARP Zoom25Percent / Zoom50Percent / Zoom75Percent / ZoomMax)."

[settings.Zoom]
type = "float"
label = "Maximum zoom-out"
description = "0% is the game's default distance (400), 100% the farthest (1224)."
