name = "WARP_Window"
category = "WARP"
version = "2.0.0"
description = "Main window tweaks: custom title, small tool-window title bar, resizable frame with minimize/maximize buttons (WARP CustomWindowTitle / UseMiniTitle / EnableSysMenu)."
libs = ["user32.lib"]

[settings.Title]
type = "string"
label = "Window title"
description = "Text of the main window's title bar; empty keeps the game's own title."
default = ""

[settings.MiniTitle]
type = "bool"
label = "Small title bar"
description = "Creates the main window as a tool window (WS_EX_TOOLWINDOW) with a small title bar."
default = false

[settings.SysMenu]
type = "bool"
label = "Resizable frame with system menu"
description = "Gives the windowed client a resizable frame with minimize, maximize and close buttons, keeping the client area size."
default = false
