name = "WARP_SkipLoading"
category = "WARP"
version = "2.0.0"
description = "Skips loading the SignBoard list and/or System\\Towninfo.lub at launch, avoiding errors when those files are missing (WARP SkipSignBoard / SkipTownInfo)."

[settings.SignBoard]
type = "bool"
label = "Skip the SignBoard list"
description = "The SignBoard list is never loaded at launch: missing signboard Lua files cause no errors and no signboards are shown."
default = true

[settings.TownInfo]
type = "bool"
label = "Skip Towninfo.lub"
description = "System\\Towninfo.lub is never run; town info loading reports success without it."
default = true
