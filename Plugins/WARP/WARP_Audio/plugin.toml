name = "WARP_Audio"
category = "WARP"
version = "2.0.0"
description = "Audio tweaks: no map/login background music, 44.1 kHz output and muting while the window is inactive (WARP NoBGMAudio / Enable44kHzAudio / AutoMute)."

[settings.NoBgm]
type = "bool"
label = "Disable map and login BGM"
description = "Map BGM lookups and the login screen's bgm\\01.mp3 play nothing; server-driven BGM still plays."
default = true

[settings.Force44kHz]
type = "bool"
label = "Force 44.1 kHz audio"
description = "The digital audio sample rate is 44.1 kHz whatever the sound settings select."
default = true

[settings.AutoMute]
type = "bool"
label = "Mute when inactive"
description = "Game audio pauses while the window is inactive and resumes when it becomes active again."
default = true
