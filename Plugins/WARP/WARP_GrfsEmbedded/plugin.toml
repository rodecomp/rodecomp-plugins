name = "WARP_GrfsEmbedded"
category = "WARP"
version = "1.1.0"
description = "Loads the Archives setting's GRF list instead of DATA.INI's entries; later entries take priority. An empty list leaves DATA.INI in charge (WARP GrfsEmbedded)."

[settings.Archives]
type = "list"
of = "path"
label = "GRF archives"
description = "Archives to load instead of DATA.INI's, later ones take priority. Empty: DATA.INI is used."
filter = ["*.grf"]
default = []
