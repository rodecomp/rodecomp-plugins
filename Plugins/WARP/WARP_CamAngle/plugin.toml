name = "WARP_CamAngle"
category = "WARP"
version = "2.0.0"
description = "Starts every map without view parameters at the chosen camera angle, from low (-65) to high (-35) (WARP HighCamAngle / MediumCamAngle / LowCamAngle)."

[settings.Pitch]
type = "float"
