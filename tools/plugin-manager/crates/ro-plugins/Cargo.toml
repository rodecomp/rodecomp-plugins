[package]
name = "ro-plugins"
description = "rodecomp plugin manager: GUI and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ro-plugins-core = { path = "../ro-plugins-core" }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui-phosphor = "0.14"
egui-notify = "0.23"
notify = "8"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
