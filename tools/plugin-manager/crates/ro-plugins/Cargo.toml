[package]
name = "ro-plugins"
description = "rodecomp plugin manager: GUI and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ro-plugins-core = { path = "../ro-plugins-core" }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui-phosphor = "0.14"
notify = "8"
rfd = "0.15"
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
# Win32_System_Registry gates SHELLEXECUTEINFOW (it holds an HKEY).
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
